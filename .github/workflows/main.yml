name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install modules
        run: node .yarn/releases/yarn-berry.cjs install --immutable

      - name: Lint, typecheck, and build
        run: node .yarn/releases/yarn-berry.cjs build

      - name: Upload installable plugin
        uses: actions/upload-artifact@v7
        with:
          name: periodic-notes
          path: |
            main.js
            styles.css
            manifest.json
          if-no-files-found: error
